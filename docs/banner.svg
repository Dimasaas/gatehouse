    <rect x="726" y="104" width="36" height="46" rx="4" fill="#E8ECF1"/>
    <rect x="740" y="108" width="8" height="3" rx="1.5" fill="#16181D"/>
    <circle cx="744" cy="124" r="7" fill="#16181D"/>
    <rect x="732" y="136" width="24" height="3" fill="#16181D"/>
    <rect x="735" y="142" width="18" height="3" fill="#8A94A6"/>
  </g>
  <line class="fluxo" x1="792" y1="164" x2="842" y2="164" stroke="#F5A524" stroke-width="3"/>

  <!-- painel de auditoria -->
  <rect x="846" y="64" width="394" height="208" rx="8" fill="#1F232B" stroke="#8A94A6" stroke-width="2"/>
  <rect x="846" y="64" width="394" height="26" rx="8" fill="#16181D" stroke="#8A94A6" stroke-width="2"/>
  <text class="m" x="860" y="82" font-size="12" fill="#8A94A6">auditoria.jsonl</text>
  <g class="m" font-size="13">
