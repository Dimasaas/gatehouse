<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">mcp-leitura</title>
  <desc id="d">Gateway MCP: o agente fala com o gateway, que aplica o escopo antes de tocar no banco.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1052"/>
      <stop offset="1" stop-color="#1b3a8a"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#B388FF"/>
    </linearGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .fluxo { stroke-dasharray: 6 8; animation: corre 1.6s linear infinite; }
      .pulso { animation: pulsa 3.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes corre { to { stroke-dashoffset: -28; } }
      @keyframes pulsa { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fluxo, .pulso, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#fundo)"/>
  <rect width="1280" height="320" fill="url(#grade)"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#brilho)"/>

  <text x="64" y="132" font-size="64" font-weight="700" fill="#ffffff">mcp-<tspan fill="#00E5FF">leitura</tspan><tspan class="cursor" fill="#B388FF">_</tspan></text>
  <text x="66" y="180" font-size="21" fill="#dfe6ff">gateway MCP com permissão por pessoa</text>
  <text x="66" y="218" font-size="16" fill="#B388FF">leitura com escopo  ·  escrita com OK  ·  tudo auditado</text>
  <text x="66" y="262" font-size="14" fill="#9fb2ec">node · @modelcontextprotocol/sdk · zod · node:test</text>

  <!-- agente -> gateway -> banco -->
  <g transform="translate(640 0)">
    <line class="fluxo" x1="118" y1="160" x2="236" y2="160" stroke="#00E5FF" stroke-width="3"/>
    <line class="fluxo" x1="372" y1="160" x2="470" y2="160" stroke="#B388FF" stroke-width="3"/>

    <rect x="0" y="118" width="118" height="84" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#00E5FF" stroke-width="2"/>
    <text x="59" y="156" font-size="17" fill="#ffffff" text-anchor="middle">agente</text>
    <text x="59" y="180" font-size="12" fill="#9fb2ec" text-anchor="middle">cliente MCP</text>

    <g class="pulso">
      <rect x="236" y="92" width="136" height="136" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="url(#brilho)" stroke-width="3"/>
    </g>
    <text x="304" y="148" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">gateway</text>
    <text x="304" y="172" font-size="12" fill="#00E5FF" text-anchor="middle">escopo</text>
    <text x="304" y="190" font-size="12" fill="#B388FF" text-anchor="middle">prévia + OK</text>
    <text x="304" y="208" font-size="12" fill="#9fb2ec" text-anchor="middle">auditoria</text>

    <rect x="470" y="118" width="118" height="84" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#B388FF" stroke-width="2"/>
    <text x="529" y="156" font-size="17" fill="#ffffff" text-anchor="middle">banco</text>
    <text x="529" y="180" font-size="12" fill="#9fb2ec" text-anchor="middle">fictício</text>
  </g>
</svg>
