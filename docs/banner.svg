<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Gatehouse</title>
  <desc id="d">Portaria de dados: o agente passa pela cancela do gateway, que confere o escopo do crachá, e cada chamada vira uma linha no log de auditoria.</desc>
  <defs>
    <clipPath id="faixaCima"><rect x="0" y="0" width="1280" height="14"/></clipPath>
    <clipPath id="faixaBaixo"><rect x="0" y="306" width="1280" height="14"/></clipPath>
    <clipPath id="painel"><rect x="846" y="64" width="394" height="208"/></clipPath>
    <style>
      .s { font-family: 'Segoe UI', system-ui, sans-serif; }
      .m { font-family: 'JetBrains Mono', Consolas, monospace; }
      .listras { animation: corre 3s linear infinite; }
      .cancela { transform-origin: 703px 196px; animation: cancela 6s ease-in-out infinite; }
      .fluxo { stroke-dasharray: 6 8; animation: fluxo 1.4s linear infinite; }
      .varre { animation: varre 6s steps(6) infinite; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes corre { to { transform: translateX(-40px); } }
      @keyframes cancela { 0%, 30% { transform: rotate(0deg); } 45%, 85% { transform: rotate(-62deg); } 100% { transform: rotate(0deg); } }
      @keyframes fluxo { to { stroke-dashoffset: -28; } }
      @keyframes varre { from { transform: translateY(0); } to { transform: translateY(168px); } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .listras, .cancela, .fluxo, .varre, .cursor { animation: none; } .cancela { transform: rotate(-30deg); } .varre { display: none; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="#16181D"/>
  <g stroke="#8A94A6" stroke-opacity=".10" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
  </g>

  <!-- listras de advertência -->
  <g clip-path="url(#faixaCima)">
    <rect width="1280" height="14" fill="#F5A524"/>
    <g class="listras" stroke="#16181D" stroke-width="10">
      <path d="M-20 18L0 -4"/><path d="M20 18L40 -4"/><path d="M60 18L80 -4"/><path d="M100 18L120 -4"/><path d="M140 18L160 -4"/><path d="M180 18L200 -4"/><path d="M220 18L240 -4"/><path d="M260 18L280 -4"/><path d="M300 18L320 -4"/><path d="M340 18L360 -4"/><path d="M380 18L400 -4"/><path d="M420 18L440 -4"/><path d="M460 18L480 -4"/><path d="M500 18L520 -4"/><path d="M540 18L560 -4"/><path d="M580 18L600 -4"/><path d="M620 18L640 -4"/><path d="M660 18L680 -4"/><path d="M700 18L720 -4"/><path d="M740 18L760 -4"/><path d="M780 18L800 -4"/><path d="M820 18L840 -4"/><path d="M860 18L880 -4"/><path d="M900 18L920 -4"/><path d="M940 18L960 -4"/><path d="M980 18L1000 -4"/><path d="M1020 18L1040 -4"/><path d="M1060 18L1080 -4"/><path d="M1100 18L1120 -4"/><path d="M1140 18L1160 -4"/><path d="M1180 18L1200 -4"/><path d="M1220 18L1240 -4"/><path d="M1260 18L1280 -4"/><path d="M1300 18L1320 -4"/><path d="M1340 18L1360 -4"/>
