<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Gatehouse</title>
  <desc id="d">Gateway MCP: o agente fala com o gateway, que aplica o escopo antes de tocar no banco.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0418"/>
      <stop offset="0.6" stop-color="#120726"/>
      <stop offset="1" stop-color="#2b0f52"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FA3"/>
      <stop offset="0.5" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4D8BFF"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <clipPath id="metade"><rect x="0" y="0" width="1280" height="296"/></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .fluxo { stroke-dasharray: 6 8; animation: corre 1.6s linear infinite; }
      .pulso { animation: pulsa 3.2s ease-in-out infinite; }
      .cursor { animation: pisca 1.1s steps(1) infinite; }
      @keyframes corre { to { stroke-dashoffset: -28; } }
      @keyframes pulsa { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
      @keyframes pisca { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .fluxo, .pulso, .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#fundo)"/>

  <!-- chão em perspectiva -->
  <g clip-path="url(#metade)" stroke-width="1" fill="none">
    <g stroke="#7C5CFF" stroke-opacity="0.35">
      <line x1="640" y1="200" x2="-400" y2="320"/><line x1="640" y1="200" x2="-120" y2="320"/>
      <line x1="640" y1="200" x2="160" y2="320"/><line x1="640" y1="200" x2="400" y2="320"/>
      <line x1="640" y1="200" x2="640" y2="320"/><line x1="640" y1="200" x2="880" y2="320"/>
      <line x1="640" y1="200" x2="1120" y2="320"/><line x1="640" y1="200" x2="1400" y2="320"/>
      <line x1="640" y1="200" x2="1680" y2="320"/>
    </g>
    <g stroke="#4D8BFF" stroke-opacity="0.35">
      <line x1="0" y1="214" x2="1280" y2="214"/><line x1="0" y1="232" x2="1280" y2="232"/>
      <line x1="0" y1="256" x2="1280" y2="256"/><line x1="0" y1="288" x2="1280" y2="288"/>
    </g>
  </g>
  <line x1="0" y1="200" x2="1280" y2="200" stroke="#FF4FA3" stroke-opacity="0.5"/>

  <!-- sol pequeno, só detalhe -->
  <g opacity="0.9">
    <circle cx="1196" cy="48" r="22" fill="url(#sol)"/>
    <rect x="1170" y="49" width="52" height="2" fill="#120726"/>
    <rect x="1170" y="56" width="52" height="3" fill="#120726"/>
    <rect x="1170" y="64" width="52" height="4" fill="#120726"/>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#brilho)"/>

  <text x="64" y="132" font-size="64" font-weight="700" fill="#FF4FA3">gatehouse<tspan class="cursor" fill="#FFB86B">_</tspan></text>
  <text x="66" y="180" font-size="20" fill="#F5EEFF">gateway MCP de leitura com escopo por pessoa</text>
  <text x="66" y="218" font-size="16" fill="#C3A8E6">escrita em 2 etapas  ·  tudo auditado</text>
  <text x="66" y="262" font-size="14" fill="#C3A8E6">node · @modelcontextprotocol/sdk · zod · node:test</text>

  <!-- agente -> gateway -> banco -->
  <g transform="translate(640 -30)">
    <line class="fluxo" x1="118" y1="160" x2="236" y2="160" stroke="#FF4FA3" stroke-width="3"/>
    <line class="fluxo" x1="372" y1="160" x2="470" y2="160" stroke="#4D8BFF" stroke-width="3"/>

    <rect x="0" y="118" width="118" height="84" rx="12" fill="#1e0d3d" stroke="#7C5CFF" stroke-width="2"/>
    <text x="59" y="156" font-size="17" fill="#F5EEFF" text-anchor="middle">agente</text>
    <text x="59" y="180" font-size="12" fill="#C3A8E6" text-anchor="middle">cliente MCP</text>

    <g class="pulso">
      <rect x="236" y="92" width="136" height="136" rx="16" fill="#1e0d3d" stroke="url(#brilho)" stroke-width="3"/>
    </g>
    <text x="304" y="148" font-size="18" font-weight="700" fill="#FF4FA3" text-anchor="middle">gatehouse</text>
    <text x="304" y="172" font-size="12" fill="#7C5CFF" text-anchor="middle">escopo</text>
    <text x="304" y="190" font-size="12" fill="#4D8BFF" text-anchor="middle">prévia + OK</text>
    <text x="304" y="208" font-size="12" fill="#C3A8E6" text-anchor="middle">auditoria</text>

    <rect x="470" y="118" width="118" height="84" rx="12" fill="#1e0d3d" stroke="#4D8BFF" stroke-width="2"/>
    <text x="529" y="156" font-size="17" fill="#F5EEFF" text-anchor="middle">banco</text>
    <text x="529" y="180" font-size="12" fill="#C3A8E6" text-anchor="middle">fictício</text>
  </g>
</svg>
