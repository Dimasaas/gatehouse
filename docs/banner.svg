  <circle cx="128" cy="116" r="20" fill="#E8ECF1"/>
  <path d="M117 124H139L146 168H110Z" fill="#E8ECF1"/>
  <circle cx="128" cy="116" r="7" fill="#16181D"/>
  <path d="M124 118H132L134 150H122Z" fill="#16181D"/>
  </g>
  <text class="s" x="54" y="204" font-size="82" font-weight="800" letter-spacing="-2" fill="#E8ECF1">gatehouse</text>
  <rect x="58" y="220" width="64" height="5" fill="#F5A524"/>
  <text class="s" x="58" y="258" font-size="21" font-weight="600" fill="#E8ECF1">gateway MCP de leitura com escopo por pessoa</text>
  <text class="m" x="58" y="284" font-size="14" fill="#8A94A6">propor → confirmar com token · tudo em auditoria.jsonl<tspan class="cursor" fill="#F5A524">_</tspan></text>

  <!-- agente -> portão -> log -->
  <g>
    <rect x="590" y="132" width="72" height="64" rx="8" fill="#1F232B" stroke="#8A94A6" stroke-width="2"/>
    <text class="s" x="626" y="161" font-size="15" font-weight="700" text-anchor="middle" fill="#E8ECF1">agente</text>
    <text class="m" x="626" y="181" font-size="11" text-anchor="middle" fill="#8A94A6">cliente MCP</text>
    <line class="fluxo" x1="662" y1="164" x2="700" y2="164" stroke="#F5A524" stroke-width="3"/>
  </g>

  <!-- portão: postes, arco com crachá e cancela -->
